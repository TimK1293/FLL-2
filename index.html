<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>FRG Punkterechner Scoreboard</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #007bff; --accent: #ffcc00; --bg: #0b0f1a; --card: #161e2d; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #timer { font-size: 12rem; font-weight: 900; color: var(--accent); text-shadow: 0 0 50px rgba(255, 204, 0, 0.4); line-height: 1; margin: 20px 0; }
        #audio-init { position: fixed; top: 10px; right: 10px; background: #e11d48; color: white; border: none; padding: 15px 25px; border-radius: 8px; cursor: pointer; z-index: 100; font-weight: bold; font-size: 1.2rem; box-shadow: 0 0 20px rgba(225, 29, 72, 0.5); }
        #audio-init.ready { background: #10b981; box-shadow: none; opacity: 0.6; }
        .id-badge { background: var(--card); padding: 10px 25px; border-radius: 50px; border: 1px solid var(--primary); margin-bottom: 30px; font-size: 1.2rem; }
        table { width: 95%; max-width: 1300px; border-collapse: separate; border-spacing: 0 10px; }
        td { background: var(--card); padding: 15px 20px; font-size: 1.5rem; text-align: center; }
        td:first-child { border-radius: 15px 0 0 15px; text-align: left; border-left: 6px solid var(--primary); }
        td:last-child { border-radius: 0 15px 15px 0; color: var(--accent); font-weight: bold; }
        .highscore-glow { background: var(--primary) !important; box-shadow: 0 0 30px rgba(0, 123, 255, 0.5); }
    </style>
</head>
<body>
    <button id="audio-init" onclick="initAudio()">1. HIER KLICKEN (SOUND AKTIVIEREN)</button>
    <div id="timer">02:30</div>
    <div class="id-badge">CODE: <strong style="color:var(--primary)">FRG</strong></div>
    <table id="scoreboard"><thead><tr id="table-head"></tr></thead><tbody id="table-body"></tbody></table>

    <script>
        const peer = new Peer('FRG');
        let allTeams = {}; let runCount = 3; let timerInt; let conns = [];
        let audioCtx = null;

        // Erzeugt einen synthetischen Piepton (Buzzer)
        function playBuzzer() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4 Ton
            osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 1); // Tiefer werdend
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const btn = document.getElementById('audio-init');
            btn.innerText = "✅ SOUND BEREIT"; btn.classList.add('ready');
            // Test-Piepser
            playBuzzer();
        }

        peer.on('connection', c => {
            conns.push(c);
            c.on('data', d => {
                if(d.type === 'UPDATE') { 
                    allTeams = d.teams.reduce((acc, t) => { acc[t.name] = t; return acc; }, {});
                    runCount = d.runCount; render(); 
                    conns.forEach(conn => conn.open && conn.send({type: 'SYNC', teams: Object.values(allTeams), runCount}));
                }
                if(d.type === 'TIMER') handleTimer(d.action);
            });
        });

        function render() {
            const tbody = document.getElementById('table-body');
            const head = document.getElementById('table-head');
            head.innerHTML = `<th>Team</th>${Array.from({length:runCount}, (_,i)=>`<th>L${i+1}</th>`).join('')}<th>Best</th>`;
            const sorted = Object.values(allTeams).sort((a,b) => Math.max(...b.runs) - Math.max(...a.runs));
            const gMax = Math.max(...sorted.flatMap(t => t.runs), 0);
            tbody.innerHTML = sorted.map(t => {
                const best = Math.max(...t.runs);
                const runs = t.runs.map(r => `<td class="${r === gMax && gMax > 0 ? 'highscore-glow' : ''}">${r}</td>`).join('');
                return `<tr><td>${t.name}</td>${runs}<td>${best}</td></tr>`;
            }).join('');
        }

        function handleTimer(a) {
            if(a === 'start') {
                if(timerInt) return; let t = 150;
                timerInt = setInterval(() => {
                    t--; 
                    if(t <= 0) { clearInterval(timerInt); timerInt = null; playBuzzer(); }
                    document.getElementById('timer').innerText = Math.floor(t/60).toString().padStart(2,'0')+":"+(t%60).toString().padStart(2,'0');
                }, 1000);
            } else { clearInterval(timerInt); timerInt = null; document.getElementById('timer').innerText = "02:30"; }
        }
    </script>
</body>
</html>
